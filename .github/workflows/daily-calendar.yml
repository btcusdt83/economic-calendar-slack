
name: Daily economic calendar to Slack

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Swedish time
        id: swedish_time
        run: |
          HOUR=$(TZ=Europe/Stockholm date +%H)
          if [ "$HOUR" = "08" ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.swedish_time.outputs.send == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.swedish_time.outputs.send == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send to Slack
        if: steps.swedish_time.outputs.send == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python calendar_to_slack.py

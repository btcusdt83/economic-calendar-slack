name: Daily economic calendar to Slack

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Europe/Stockholm'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python calendar_to_slack.py
